<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="time" content="<%=VITE_APP_TIME %>" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/layui/css/layui.css" />
    <title>SPD管理系统</title>
    <!--[if lt IE 11
      ]><script>
        window.location.href = '/html/ie.html'
      </script><!
    [endif]-->
      <style>
          html,
          body,
          #app {
              height: 100%;
              margin: 0px;
              padding: 0px;
          }
          * {
              -webkit-touch-callout: auto; /*系统默认菜单被禁用*/
              -webkit-user-select: auto !important; /*webkit浏览器*/
              -khtml-user-select: auto; /*早期浏览器*/
              -moz-user-select: auto; /*火狐*/
              -ms-user-select: auto; /*IE10*/
              user-select: auto !important;
          }
          .chromeframe {
              margin: 0.2em 0;
              background: #ccc;
              color: #000;
              padding: 0.2em 0;
          }

          #loader-wrapper {
              position: fixed;
              top: 80px;
              left: 0;
              width: 100%;
              height: 100%;
              z-index: 99999;
          }

          @-webkit-keyframes spin {
              0% {
                  -webkit-transform: rotate(0deg);
                  -ms-transform: rotate(0deg);
                  transform: rotate(0deg);
              }

              100% {
                  -webkit-transform: rotate(360deg);
                  -ms-transform: rotate(360deg);
                  transform: rotate(360deg);
              }
          }

          @keyframes spin {
              0% {
                  -webkit-transform: rotate(0deg);
                  -ms-transform: rotate(0deg);
                  transform: rotate(0deg);
              }

              100% {
                  -webkit-transform: rotate(360deg);
                  -ms-transform: rotate(360deg);
                  transform: rotate(360deg);
              }
          }

          #loader-wrapper .loader-section {
              /*   position: fixed;
              top: 0;*/
              width: 100%;
              height: 100%;
              background: #fff;
              z-index: 1000;
              -webkit-transform: translateX(0);
              -ms-transform: translateX(0);
              transform: translateX(0);
          }

          #loader-wrapper .loader-section.section-left {
              left: 0;
          }

          #loader-wrapper .loader-section.section-right {
              right: 0;
          }

          .loaded #loader-wrapper .loader-section.section-left {
              -webkit-transform: translateX(-100%);
              -ms-transform: translateX(-100%);
              transform: translateX(-100%);
              -webkit-transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
              transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
          }

          .loaded #loader-wrapper .loader-section.section-right {
              -webkit-transform: translateX(100%);
              -ms-transform: translateX(100%);
              transform: translateX(100%);
              -webkit-transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
              transition: all 0.7s 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
          }

          .loaded #loader {
              opacity: 0;
              -webkit-transition: all 0.3s ease-out;
              transition: all 0.3s ease-out;
          }

          .loaded #loader-wrapper {
              visibility: hidden;
              -webkit-transform: translateY(-100%);
              -ms-transform: translateY(-100%);
              transform: translateY(-100%);
              -webkit-transition: all 0.3s 1s ease-out;
              transition: all 0.3s 1s ease-out;
          }

          .no-js #loader-wrapper {
              display: none;
          }

          .no-js h1 {
              color: #222222;
          }

          #loader {
              display: block;
              position: relative;
              left: 50%;
              top: 41%;
              width: 40px;
              height: 40px;
              margin: -20px 0 0 -20px;
              border-radius: 50%;
              border: 2px solid transparent;
              border-top-color: #165DFF;
              -webkit-animation: spin 2s linear infinite;
              -ms-animation: spin 2s linear infinite;
              -moz-animation: spin 2s linear infinite;
              -o-animation: spin 2s linear infinite;
              animation: spin 2s linear infinite;
              z-index: 1001;
          }
          #loader-wrapper .load_title {
              font-family: 'Open Sans';
              color: #165DFF;
              font-size: 14px;
              width: 100%;
              text-align: center;
              z-index: 9999999999999;
              position: absolute;
              top: 45%;
              opacity: 1;
              line-height: 14px;
          }

          #loader-wrapper .load_title span {
              font-weight: normal;
              font-style: italic;
              font-size: 14px;
              color: #165DFF;
              opacity: 0.5;
          }
      </style>
  </head>

  <body style="position: relative" id="fundBox">
      <iframe
              name="_print_pdf_frame"
              id="_print_pdf_frame"
              width="0"
              height="0"
              style="opacity: 0; position: fixed"
              frameborder="0"
              src="about:blank"
      ></iframe>
      <div id="app" style="background: #fff">
          <div id="loader-wrapper">
              <div id="loader"></div>
              <div class="loader-section section-left"></div>
              <div class="loader-section section-right"></div>
              <div class="load_title">请稍候...</div>
          </div>
      </div>
      <script type="module" src="/src/main.js"></script>
  </body>
</html>
